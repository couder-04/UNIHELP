# IIT Patna org profile. Catalog names are the ones actually hardcoded in
# fast_parse.py / room_functions.py / mess_functions_1.py / Bus_agent.py —
# not the design-doc sample. A missing or empty catalog field fails at
# startup (see org_profile.py) rather than silently dropping a hostel.

org_id: iit_patna
display_name: IIT Patna
timezone: Asia/Kolkata
roles: [student, faculty, admin]
enabled_agents:
  - mess
  - bus
  - complaint
  - room_booking
  - attendance
  - notice
  - timetable

catalog:
  # Order matches mess_agent_1's "Which hostel?" prompt so that string
  # stays byte-identical when generated from this list.
  hostels:
    - name: Kalam
    - name: CV Raman
      aliases:
        - c v raman
        - cvraman
        - cv-raman
        - c.v. raman
        - c. v. raman
    - name: Aryabhatta
      aliases:
        - arya bhatta
    - name: Asima

  # Bookable facilities from room_functions._FACILITY_ALIASES, not the
  # lecture-hall roster in timetable.rooms.
  rooms:
    - name: SAC Hall
      aliases: [sac, sac_hall, sac-hall, sachall]
    - name: Guest House
      aliases: [guesthouse, guest_house, guest-house, gh]
    - name: CLH
    - name: Auditorium

  buses:
    - name: "Bus 01"
    - name: "Bus 02"
    - name: "Bus 03"
    - name: "Bus 04"
    - name: "Bus 05"

  meals:
    - name: breakfast
    - name: lunch
    - name: snacks
      aliases: [snack]
    - name: dinner
      aliases: [supper]

  complaint_categories:
    - academic
    - hostel
    - mess

identity:
  student_id_field: roll_number
  student_id_pattern: "^[0-9]{4}[A-Z]{2}[0-9]{2}$"
