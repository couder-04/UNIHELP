# Tiny fake org used only by tests/fast_parse/test_catalog_driven.py to
# prove parsers resolve against ORG.catalog, not IIT Patna's hardcoded list.
org_id: test_college
display_name: Test College
timezone: UTC
roles: [student, faculty, admin]
enabled_agents: [mess, bus, complaint, room_booking, attendance, notice, timetable]
catalog:
  hostels:
    - name: North
      aliases: ["north hall"]
    - name: South
  rooms:
    - name: Gym
  buses:
    - name: "Bus 07"
  meals:
    - name: breakfast
    - name: lunch
    - name: snacks
      aliases: [snack]
    - name: dinner
      aliases: [supper]
  complaint_categories: [academic, hostel, mess]
identity:
  student_id_field: roll_number
  student_id_pattern: "^[0-9]{4}[A-Z]{2}[0-9]{2}$"
